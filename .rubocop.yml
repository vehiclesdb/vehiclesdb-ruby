plugins:
  - rubocop-minitest
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always
Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120
Metrics/MethodLength:
  Max: 30

# Thorough unit tests legitimately make several related assertions.
Minitest/MultipleAssertions:
  Enabled: false
